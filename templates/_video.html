<figure class="lesson-video" data-slug="{{ v.slug }}">
  <video controls playsinline preload="metadata" data-slug="{{ v.slug }}" crossorigin="anonymous"
         poster="{{ url_for('static', filename='videos/' ~ v.slug ~ '.jpg') }}">
    <source src="{{ url_for('static', filename='videos/' ~ v.slug ~ '.mp4') }}" type="video/mp4">
    <track kind="subtitles" srclang="en" label="English"
           src="{{ url_for('static', filename='videos/' ~ v.slug ~ '.vtt') }}">
  </video>
  <figcaption>
    <span class="vid-title">🎬 {{ v.title }}</span> · {{ v.length }}<span class="watched-tag" hidden> · ✓ Watched</span>
    <span class="vid-tools">
      <button type="button" class="vid-btn" data-cc aria-pressed="false" title="Subtitles">CC</button>
      <button type="button" class="vid-btn" data-speed title="Playback speed">1×</button>
    </span>
  </figcaption>
</figure>
